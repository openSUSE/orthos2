# Shared services for the local, self-contained stack (dev and testing variants).
# This file is never used on its own - always combine it with either compose.dev.yaml
# or compose.testing.yaml, plus compose.dev.override.yml. Use the Makefile rather than
# calling docker compose directly, since it also builds the orthos2/orthos2-static
# images in the required order (see docker/compose#6332):
#   make up-dev
#   make up-testing
#
# compose.dev.override.yml (Traefik routing for the "netbox" service pulled in via the
# include: below) must stay a separate -f layer rather than a service block in this file:
# Compose versions differ on whether redeclaring an include:'d service in the *same* file
# is a merge or a "conflicts with imported resource" error (docker/compose#11404, #11482).
# A later -f file is unambiguously a merge, so that's the only version-safe way to extend it.
#
# Compose merges services across -f files: plain lists (env_file, cap_add) are appended,
# secrets/volumes/ports merge by their unique key (target/mount path), and mappings
# (environment, labels) are merged key-by-key. See compose.dev.yaml/compose.testing.yaml
# for the orthos2/orthos2_taskmanager fields (image, env_file, secrets) that vary per
# variant - their images are built by the Makefile, not by compose's build:.
#
# orthos2_nginx (serves collected static files in front of the production image) is only
# needed by compose.testing.yaml, which exercises the production dockerfile - the dev
# stack serves static files directly via Django's runserver (DEBUG=True), so it's defined
# entirely there rather than here.
#
# For the hostnames to work an entry in /etc/hosts is needed:
# 127.0.0.1 authentik.orthos2.test orthos2.orthos2.test cobbler.orthos2.test netbox.orthos2.test testmachine.orthos2.test
include:
  - docker/authentik/compose.authentik.yaml
  - docker/netbox/compose.netbox.yml

services:
  proxy:
    image: traefik:v3.6
    container_name: traefik
    command:
      - --accesslog=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
      - ./docker/traefik/certs/authentik.orthos2.test.crt:/certs/authentik.orthos2.test.crt:ro,z
      - ./docker/traefik/certs/authentik.orthos2.test.key:/certs/authentik.orthos2.test.key:ro,z
      - ./docker/traefik/dynamic_conf.yaml:/etc/traefik/dynamic/certs.yaml:ro,z
    restart: always
    networks:
      orthos:
        aliases:
          - authentik.orthos2.test
          # cobblerd/http-api don't listen on port 80 themselves (see the "cobblerd"/"http-api" services
          # below) - orthos2's plain "http://cobbler.orthos2.test/cobbler_api" XML-RPC calls only work
          # because this alias sends that hostname straight to Traefik, which then path-routes it.
          - cobbler.orthos2.test
    security_opt:
      - label:disable
  orthos2:
    hostname: orthos2.orthos2.test
    cap_add:
      - NET_RAW
    volumes:
      - ./:/code:z
      - ./docker/test-machine/ssh-keys/orthos2-test-machine:/var/lib/orthos2/.ssh/orthos2-test-machine:ro,z
      - ./docker/test-machine/ssh-keys/config:/var/lib/orthos2/.ssh/config:ro,z
    networks:
      - orthos
    depends_on:
      orthos2_database:
        condition: service_healthy
      netbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orthos2-http.rule=Host(`orthos2.orthos2.test`)"
      - "traefik.http.routers.orthos2-http.entrypoints=web"
      - "traefik.http.routers.orthos2-http.middlewares=orthos2-https"
      - "traefik.http.middlewares.orthos2-https.redirectScheme.scheme=https"
      - "traefik.http.routers.orthos2-https.rule=Host(`orthos2.orthos2.test`)"
      - "traefik.http.routers.orthos2-https.entrypoints=websecure"
      - "traefik.http.routers.orthos2-https.tls=true"
      - "traefik.http.services.orthos2.loadbalancer.server.port=8000"
  orthos2_taskmanager:
    environment:
      ORTHOS2_MODE: "taskmanager"
    cap_add:
      - NET_RAW
    volumes:
      - ./:/code
      - ./docker/test-machine/ssh-keys/orthos2-test-machine:/var/lib/orthos2/.ssh/orthos2-test-machine:ro,z
      - ./docker/test-machine/ssh-keys/config:/var/lib/orthos2/.ssh/config:ro,z
    networks:
      - orthos
    depends_on:
      orthos2_database:
        condition: service_healthy
      orthos2:
        condition: service_healthy
  orthos2_database:
    image: postgres
    restart: always
    hostname: database.orthos2.test
    env_file:
      - "docker/orthos/db.env"
    networks:
      - orthos
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -d $${POSTGRES_USER} -U $${POSTGRES_USER}",
        ]
      interval: 1s
      timeout: 5s
      retries: 10
  # Cobbler now runs as upstream's own published container images (see
  # https://cobbler.readthedocs.io/en/latest/user-guide/docker-deployment.html).
  cobblerd:
    image: ghcr.io/cobbler/cobblerd:v4.0.0a7
    command: ["cobblerd", "-F"]
    environment:
      COBBLER_XMLRPC_BIND_ADDRESS: "0.0.0.0"
    configs:
      - source: cobbler-settings
        target: /etc/cobbler/settings.yaml
        mode: 0640
      - source: cobbler-logging-config
        target: /etc/cobbler/logging_config.conf
        mode: 0644
      # Registered as the active "dhcpv4"/"dhcpv6" templates by
      # docker/orthos/setup_cobbler_dhcp_templates.py - only cobblerd renders DHCP config
      # (modules.process_management/isc.py), so http-api doesn't need these.
      - source: cobbler-dhcp-template
        target: /var/lib/cobbler/templates/orthos2-dhcp.template
        mode: 0644
      - source: cobbler-dhcpv6-template
        target: /var/lib/cobbler/templates/orthos2-dhcp6.template
        mode: 0644
      # Registered as the active "named_primary" template by
      # docker/orthos/setup_cobbler_dns_templates.py.
      - source: cobbler-named-template
        target: /var/lib/cobbler/templates/orthos2-named.template
        mode: 0644
    volumes:
      - cobbler-etc:/etc/cobbler:z
      - cobbler-var-lib:/var/lib/cobbler:z
      - cobbler-webdir:/srv/www/cobbler:z
      - cobbler-tftproot:/srv/tftpboot:z
      - cobbler-dhcp-config:/etc/cobbler-dhcp:z
      - cobbler-dns-config:/etc/cobbler-dns:z
      # bind.py writes named.conf's referenced zone files here (settings.bind_zonefile_path) -
      # without sharing it, they'd land on cobblerd's own ephemeral filesystem, same bug class as
      # the dhcpd6.conf fix in the Cobbler repo's docker/images/cobblerd/Dockerfile.
      - cobbler-dns-zones:/var/lib/named:z
      # Required to restart the sidecar DHCP & DNS containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read-only source tree for distro kernels/initrds - modules.httpd/tftpd below serve
      # straight from here (managers.dynamic_httpd/dynamic_tftp) instead of copying content
      # into cobbler-webdir/cobbler-tftproot, and it's also where a Distro's "kernel"/"initrd"
      # paths must point so cobblerd's own file-existence check finds them.
      - type: bind
        source: ${COBBLER_DISTRO_SOURCE_DIR:-./distro-sources}
        target: /srv/distro-sources
        read_only: true
        bind:
          create_host_path: true
    networks:
      - orthos
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cobbler-api-http.rule=Host(`cobbler.orthos2.test`) && PathPrefix(`/cobbler_api`)"
      - "traefik.http.routers.cobbler-api-http.entrypoints=web"
      - "traefik.http.routers.cobbler-api-http.middlewares=cobbler-api-strip"
      - "traefik.http.routers.cobbler-api-https.rule=Host(`cobbler.orthos2.test`) && PathPrefix(`/cobbler_api`)"
      - "traefik.http.routers.cobbler-api-https.entrypoints=websecure"
      - "traefik.http.routers.cobbler-api-https.tls=true"
      - "traefik.http.routers.cobbler-api-https.middlewares=cobbler-api-strip"
      - "traefik.http.middlewares.cobbler-api-strip.stripprefix.prefixes=/cobbler_api"
      - "traefik.http.services.cobbler-api.loadbalancer.server.port=25151"
    security_opt:
      - label:disable
    restart: unless-stopped

  http-api:
    image: ghcr.io/cobbler/cobblerd:v4.0.0a7
    command: ["gunicorn", "cobbler.services:application", "--bind", "0.0.0.0:8000"]
    environment:
      COBBLER_XMLRPC_HOST: "cobblerd"
    configs:
      - source: cobbler-settings
        target: /etc/cobbler/settings.yaml
        mode: 0440
    volumes:
      - cobbler-webdir:/srv/www/cobbler:ro,z
      - cobbler-tftproot:/srv/tftpboot:ro,z
      - type: bind
        source: ${COBBLER_DISTRO_SOURCE_DIR:-./distro-sources}
        target: /srv/distro-sources
        read_only: true
        bind:
          create_host_path: true
    networks:
      - orthos
    depends_on:
      cobblerd:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cobbler-http-api-http.rule=Host(`cobbler.orthos2.test`) && (PathPrefix(`/cblr`) || PathPrefix(`/httpboot`) || PathPrefix(`/images`))"
      - "traefik.http.routers.cobbler-http-api-http.entrypoints=web"
      - "traefik.http.routers.cobbler-http-api-http.middlewares=cobbler-svc-strip"
      - "traefik.http.routers.cobbler-http-api-https.rule=Host(`cobbler.orthos2.test`) && (PathPrefix(`/cblr`) || PathPrefix(`/httpboot`) || PathPrefix(`/images`))"
      - "traefik.http.routers.cobbler-http-api-https.entrypoints=websecure"
      - "traefik.http.routers.cobbler-http-api-https.tls=true"
      - "traefik.http.routers.cobbler-http-api-https.middlewares=cobbler-svc-strip"
      - "traefik.http.middlewares.cobbler-svc-strip.stripprefix.prefixes=/cblr/svc"
      - "traefik.http.services.cobbler-http-api.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  cobbler-tftp:
    image: ghcr.io/cobbler/cobbler-tftp:latest
    environment:
      COBBLER_XMLRPC_HOST: "cobblerd"
    ports:
      - "69:69/udp"
    networks:
      - orthos
    depends_on:
      cobblerd:
        condition: service_healthy
    restart: unless-stopped

  cobbler-dhcp:
    image: ghcr.io/cobbler/cobbler-dhcp:v4.0.0a7
    networks:
      - orthos
    volumes:
      - cobbler-dhcp-config:/etc/cobbler-dhcp:ro,z
    depends_on:
      cobblerd:
        condition: service_healthy
    restart: unless-stopped

  # Same image as "cobbler-dhcp", running ISC dhcpd's separate "-6" (DHCPv6) mode against the
  # dhcpd6.conf the cobblerd Dockerfile fix now shares into this same volume. Reads it straight
  # from the shared directory rather than via a "/etc/dhcpd6.conf" symlink, since this image (built
  # for the v4 role) only sets one up for dhcpd.conf. dhcpd6 needs its own lease directory/file
  # bootstrapped first, same reason the image's own Dockerfile does this for dhcpd.leases - ISC
  # dhcpd never creates one itself and exits immediately if it's missing.
  #
  # This image's Dockerfile bakes in "cobbler.io/managed-service=dhcp" (see
  # docker/images/dhcp/Dockerfile in the Cobbler repo) - reusing it verbatim for a second container
  # would make cobblerd's process_management.docker restart-by-label lookup ambiguous (it hard-errors
  # if more than one container carries the label it's searching for). Overriding the label here to
  # "dhcp6", paired with the "dhcpd6: dhcp6" entry in modules.process_management.docker_service_labels
  # below, keeps the v4/v6 sidecars independently restartable.
  cobbler-dhcp6:
    image: ghcr.io/cobbler/cobbler-dhcp:v4.0.0a7
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /var/lib/dhcp6/db && touch -a /var/lib/dhcp6/db/dhcpd6.leases && \
        exec dhcpd -6 -f -cf /etc/cobbler-dhcp/dhcpd6.conf -lf /var/lib/dhcp6/db/dhcpd6.leases
    labels:
      - "cobbler.io/managed-service=dhcp6"
    networks:
      - orthos
    volumes:
      - cobbler-dhcp-config:/etc/cobbler-dhcp:ro,z
    depends_on:
      cobblerd:
        condition: service_healthy
    restart: unless-stopped

  cobbler-dns:
    image: ghcr.io/cobbler/cobbler-dns:v4.0.0a7
    volumes:
      - cobbler-dns-config:/etc/cobbler-dns:ro,z
      # Read-write, unlike cobbler-dns-config above: BIND's own "directory" option (where
      # dump-file/statistics-file/memstatistics-file and its own runtime state live) is this same
      # path, and named refuses to start ("directory ... is not writable") if it can't write there
      # - even though it only ever reads the zone files cobblerd renders into it.
      - cobbler-dns-zones:/var/lib/named:z
    networks:
      - orthos
    depends_on:
      cobblerd:
        condition: service_healthy
    restart: unless-stopped

  serial_console:
    hostname: sconsole.orthos2.test
    networks:
      - orthos
    build:
      context: docker/serial-console
      dockerfile: serial-console.dockerfile
      secrets:
        - SCCcredentials
    #ports:
    #  - 22:22
  machine_bmc:
    hostname: bmc.orthos2.test
    networks:
      - orthos
    build:
      context: docker/bmc
      dockerfile: bmc.dockerfile
      secrets:
        - SCCcredentials
    ports:
      - "9001:9001"
  test_machine:
    hostname: testmachine.orthos2.test
    networks:
      - orthos
    build:
      context: docker/test-machine
      dockerfile: test-machine.dockerfile
      secrets:
        - SCCcredentials
    depends_on:
      orthos2_database:
        condition: service_healthy

secrets:
  SCCcredentials:
    file: docker/secrets/SCCcredentials

# Injected into both cobblerd and http-api above; only lists keys that differ from cobbler.settings's
# built-in defaults (Settings.from_dict() overlays these onto an already fully-populated Settings()).
# "modules" is given in full, not as a partial override - from_dict() replaces each top-level key
# wholesale rather than deep-merging, so a partial "modules" override would silently blank out any
# sub-key left out below instead of leaving it at its default.
configs:
  cobbler-settings:
    content: |
      tftpboot_location: "/srv/tftpboot"
      webdir: "/srv/www/cobbler"
      manage_tftpd: false
      server: "cobbler.orthos2.test"
      # Without these, `cobbler sync` never writes /etc/cobbler-dhcp/dhcpd.conf or
      # /etc/cobbler-dns/named.conf (both default to false) - the cobbler-dhcp/cobbler-dns
      # sidecars below would then crash-loop forever on a dangling symlink to a file that
      # sync never creates, instead of just until the first sync (as documented upstream).
      manage_dhcp_v4: true
      manage_dhcp_v6: true
      manage_dns: true
      # False (the default) is only safe once settings.yaml is already on the current schema
      # version, which it is here (freshly generated by this image) - true would let cobblerd
      # silently rewrite this config on a schema change instead of refusing to start with a
      # clear "automigration disabled but required" error. Flip to true only when upgrading
      # cobblerd across a settings-schema-breaking version and migrating an existing volume.
      auto_migrate_settings: false
      # Forward zone: plain domain name(s), matched by longest DNS-name suffix.
      manage_forward_zones:
        - "orthos2.test"
      # Reverse zone: a dotted-decimal *prefix* (not CIDR, not in-addr.arpa) - "192.0.2" here
      # covers the whole 192.0.2.0/24 network (cobbler/modules/managers/bind.py matches it via
      # "^192\.0\.2\." against each system's address, then reverses the remaining octet).
      #
      # The "2001:db8" entry isn't optional once manage_dhcp_v6/the "2001:db8::/64" DHCPv6 subnet
      # below are in play: bind.py's __reverse_zones() only pre-populates its zone dict from this
      # list, then does an unconditional zones[zone][...] = ... for every system's address - any
      # IPv6 host under a network with no matching entry here makes `cobbler sync` raise a bare
      # KeyError and abort (not skip that one host). The exact string only needs to contain a ":"
      # and be a parseable IPv6 prefix - bind.py re-derives the real zone key from
      # __expand_ipv6(zone + "::1")[:19], which independently normalizes "2001:db8"/"2001:db8::"/
      # etc. to "2001:0db8:0000:0000" - the same value it computes for each host's own address.
      manage_reverse_zones:
        - "192.0.2"
        - "2001:db8"
      # Matches the "cobbler-dns-zones" volume mounted rw on both cobblerd and cobbler-dns below -
      # bind.py writes named.conf's referenced zone files here, same as the default already is.
      bind_zonefile_path: "/var/lib/named"

      modules:
        authentication:
          module: "authentication.configfile"
          hash_algorithm: "sha3_512"
        authorization:
          module: "authorization.allowall"
        dns:
          module: "managers.bind"
        dhcp:
          module: "managers.isc"
        httpd:
          module: "managers.dynamic_httpd"
        tftpd:
          module: "managers.dynamic_tftp"
        process_management:
          module: "auto"
          docker_socket_path: "/var/run/docker.sock"
          docker_service_labels:
            dhcpd: "dhcp"
            dhcpd4: "dhcp"
            # Distinct from "dhcp" ("cobbler-dhcp") - "cobbler-dhcp6" overrides its
            # cobbler.io/managed-service label to "dhcp6" precisely so these two don't collide.
            dhcpd6: "dhcp6"
            named: "dns"
            dnsmasq: "dnsmasq"
        serializers:
          module: "serializers.file"

  # Overrides the RPM-shipped /etc/cobbler/logging_config.conf: raises handler_stdout to DEBUG
  # (root logger is already DEBUG) so debug-level output actually reaches "docker compose logs
  # cobblerd" instead of being filtered out by the handler, and drops the FileHandler entirely -
  # containers log to stdout, not to a file that would silently accumulate inside the container
  # (or need its own volume/rotation) at /var/log/cobbler/cobbler.log.
  cobbler-logging-config:
    content: |
      [loggers]
      keys=root

      [handlers]
      keys=stdout

      [formatters]
      keys=stdout

      [logger_root]
      level=DEBUG
      handlers=stdout

      [handler_stdout]
      class=StreamHandler
      level=DEBUG
      formatter=stdout
      args=(sys.stdout,)

      [formatter_stdout]
      format=%(levelname)s | %(message)s
      class=logging.Formatter

  # Custom DHCPv4/v6 templates covering the orthos2 dev stack's "192.0.2.0/24"/"2001:db8::/64"
  # networks - Cobbler 4.0 templates are DB objects selected by tag, not a fixed
  # /etc/cobbler/dhcp.template path (see docs/user-guide/templating.rst), so these files alone
  # do nothing until docker/orthos/setup_cobbler_dhcp_templates.py registers them as Template
  # items tagged "dhcpv4"/"dhcpv6" + "active".
  cobbler-dhcp-template:
    file: docker/orthos/cobbler-templates/dhcp.template
  cobbler-dhcpv6-template:
    file: docker/orthos/cobbler-templates/dhcp6.template

  # Fixes the built-in "named_primary" template's logging block so the "cobbler-dns" sidecar
  # actually starts (see docker/orthos/cobbler-templates/named.template) - registered as the active
  # "named_primary" template by docker/orthos/setup_cobbler_dns_templates.py.
  cobbler-named-template:
    file: docker/orthos/cobbler-templates/named.template

volumes:
  database:
    driver: local
  cobbler-etc:
  cobbler-var-lib:
  cobbler-webdir:
  cobbler-tftproot:
  cobbler-dhcp-config:
  cobbler-dns-config:
  cobbler-dns-zones:
networks:
  # Pinned (rather than Docker's default auto-assigned subnet) because the "cobbler-dhcp" sidecar
  # joins this same network - dhcpd refuses to listen on any interface without a matching "subnet"
  # declaration for its actual address, so docker/orthos/cobbler-templates/dhcp.template's dummy
  # subnet has to name this exact, stable value rather than chase whatever Docker happens to pick.
  orthos:
    ipam:
      config:
        - subnet: "172.20.0.0/16"
          gateway: "172.20.0.1"
