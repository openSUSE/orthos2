{% load filters %}
<div class="title">
  <h5>Actions</h5>
</div>

<div class="btn-group-vertical d-flex">
  <a
    class="btn btn-warning btn-sm"
    href="{% url 'frontend:edit_singletask' singletask.pk %}"
    role="button"
    >Edit Single Task</a
  >
</div>
<br />
<form
  method="post"
  action="{% url 'frontend:singletask_toggle_running' singletask.pk %}"
  class="w-100"
>
  {% csrf_token %}
  <button
    type="submit"
    class="btn btn-danger btn-sm w-100"
    title="Recovery for a task stuck as running because the taskmanager was killed/restarted mid-execution"
  >
    Force Toggle "Running" Flag
  </button>
</form>
<br />
<div class="btn-group-vertical d-flex">
  <a
    class="btn btn-danger btn-sm"
    href="{% url 'frontend:delete_singletask' singletask.pk %}"
    role="button"
    >Delete Single Task</a
  >
</div>
