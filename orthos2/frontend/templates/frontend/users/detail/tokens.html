{% extends 'frontend/users/user.html' %}

{% block tabcontent %}
  <div class="container-fluid">
    <div class="title">
      <h5>Tokens</h5>
    </div>

    {% if tokens %}
      <table class="table table-striped table-bordered small">
        <thead class="thead-default">
          <tr>
            <th>Key</th>
            <th>Created</th>
            <th width="80px">&nbsp;</th>
          </tr>
        </thead>
        <tbody>
          {% for token in tokens %}
            <tr>
              <td><code>{{ token.key }}</code></td>
              <td>{{ token.created }}</td>
              <td>
                <a
                  href="{% url 'frontend:delete_token' token.user.pk %}"
                  class="btn btn-danger btn-sm"
                >
                  Revoke
                </a>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <div class="alert alert-info">No tokens for this user.</div>
    {% endif %}
  </div>
{% endblock %}
