{% extends 'frontend/base.html' %}
{% load static %}
{% load tags %}

{% block content %}
  <div class="container-fluid">
    <div class="row">
      <main class="col-12">
        <ul class="nav nav-tabs gray">
          <li class="nav-item">
            <a
              class="nav-link {% active_view request 'user_detail' %}"
              href="{% url 'frontend:user_detail' user_obj.pk %}"
              >Overview</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link {% active_view request 'user_reservations' %}"
              href="{% url 'frontend:user_reservations' user_obj.pk %}"
              >Reservations</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link {% active_view request 'user_tokens' %}"
              href="{% url 'frontend:user_tokens' user_obj.pk %}"
              >Tokens</a
            >
          </li>
        </ul>

        <div class="tab-content">
          {% block tabcontent %}
          {% endblock %}
        </div>
      </main>
    </div>
  </div>
{% endblock %}
