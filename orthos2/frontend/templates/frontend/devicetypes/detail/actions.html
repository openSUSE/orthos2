{% load filters %}
<div class="title">
  <h5>Actions</h5>
</div>

<div class="btn-group-vertical d-flex">
  <a
    class="btn btn-warning btn-sm"
    href="{% url 'frontend:edit_devicetype' devicetype.pk %}"
    role="button"
    >Edit Device Type</a
  >
</div>
<br />
<div class="btn-group-vertical d-flex">
  {% if devicetype.netbox_id %}
    <a
      class="btn btn-secondary btn-sm"
      href="{% url 'frontend:devicetype_netbox_fetch' devicetype.pk %}"
      role="button"
      >Fetch Netbox</a
    >
  {% else %}
    <a
      class="btn btn-secondary btn-sm disabled"
      href="#"
      role="button"
      title="Not linked to NetBox"
      >Fetch Netbox</a
    >
  {% endif %}
</div>
<br />
<div class="btn-group-vertical d-flex">
  <a
    class="btn btn-danger btn-sm"
    href="{% url 'frontend:delete_devicetype' devicetype.pk %}"
    role="button"
    >Delete Device Type</a
  >
</div>
