{% load tags %}
{% load static %}
<div class="text-end text-sm header" style="color: #ffffff;">
  <div class="small">
    {% if user.is_authenticated %}
      {% if user.is_superuser %}
        <i class="fa-solid fa-user-doctor fa-lg"></i> {{ user.username }}
      {% else %}
        <i class="fa-solid fa-user fa-lg"></i> {{ user.username }}
      {% endif %}
      <span class="ms-4"></span>
      <a
        class="link-light link-opacity-50 link-opacity-75-hover link-underline-opacity-0-hover"
        href="{% url 'frontend:preferences_user' %}"
        ><i class="fa-solid fa-gears fa-lg"></i> Preferences</a
      >
    {% endif %}
    <span class="ms-4"></span>

    <a
      class="link-light link-opacity-50 link-opacity-75-hover link-underline-opacity-0-hover"
      href="{% get_bugreport_url %}"
      target="_blank"
      ><i class="fa-solid fa-bug fa-lg"></i> Bugreport</a
    ><span class="ms-4" />

    {% if user.is_authenticated %}
      <form
        id="logout-form"
        class="d-inline"
        method="post"
        action="{% url 'frontend:logout' %}"
      >
        {% csrf_token %}
        <button type="submit" class="btn btn-link p-0">
          <i class="fa-solid fa-right-from-bracket fa-lg"></i> Logout
        </button>
      </form>
    {% endif %}
  </div>
</div>
