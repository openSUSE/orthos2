{% extends 'frontend/base.html' %}
{% load static %}
{% load tags %}
{% load filters %}

{% block content %}
  <div class="container-fluid">
    <form method="post">
      {% csrf_token %}
      <p>
        Are you sure you want to delete network interface "{{ object.name }}"
        ({{ object.mac_address }}) from {{ object.machine.fqdn }}?
      </p>
      {{ form }}
      <a
        href="{% url 'frontend:networkinterfaces' object.machine_id %}"
        class="btn btn-outline-secondary btn-sm"
      >
        Cancel
      </a>
      <input
        class="btn btn-danger btn-sm"
        type="submit"
        value="Confirm deletion"
      />
    </form>
  </div>
{% endblock %}
