{% extends 'frontend/serverconfigs/serverconfig.html' %}

{% block tabcontent %}
  <div class="row">
    <div class="col-10">
      <div class="container-fluid">
        <div class="title">
          <h5>{{ serverconfig.key }}</h5>
        </div>

        <table class="table table-striped table-bordered small">
          <tbody class="thead-default">
            <tr>
              <td class="th fw-bold" width="150px">Key</td>
              <td>{{ serverconfig.key }}</td>
            </tr>
            <tr>
              <td class="th fw-bold">Value</td>
              <td>{{ serverconfig.value }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="col-2">
      {% include 'frontend/serverconfigs/detail/actions.html' %}
    </div>
  </div>
{% endblock %}
