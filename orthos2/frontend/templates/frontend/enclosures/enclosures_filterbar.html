{% load tags %}

<div class="container-fluid" style="margin-bottom: 15px;">
  <div class="row">
    <div class="col-12 d-flex align-items-center">

      <div class="d-flex align-items-center flex-wrap">
      <div class="dropdown" style="display: inline-block;">
        <button class="btn btn-secondary btn-sm dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          {% get_current_platform_filter request %}
        </button>
        <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
          <a class="dropdown-item" href="?{% url_replace request 'platform' platform.name True %}">All Platform</a>
          <div class="dropdown-divider"></div>
          {% for platform in platforms %}
          <a class="dropdown-item" href="?{% url_replace request 'platform' platform.name %}">{{ platform.name }}</a>
          {% endfor %}
        </div>
      </div>

      <span class="ms-2"></span>

      {% include 'frontend/snippet.search.html' %}

      <span class="ms-2"></span>

      <div style="display: inline-block">
          <span class="hint">Found {{ paginator.count }} Platform(s)</span>
      </div>
      </div>

      <a class="nav-link ms-auto" href="{% url 'frontend:new_enclosure' %}">
        <button type="button" class="btn btn-success">+</button>
      </a>

    </div>
  </div>
</div>
