[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orthos2"
version = "1.22"
description = "Machine administration server"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "orthos team"}]
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/openSUSE/orthos2"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["*tests*", "*docker*", "docs"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "orthos2.settings"
# Keep the Django test run scoped to the app; docker/cobbler-http-sd/tests is a standalone,
# non-Django test suite with its own dedicated runner (see docker/cobbler-http-sd/README).
testpaths = ["orthos2"]

[tool.isort]
profile = "black"
known_cobbler="orthos2"
known_tests="tests"
sections="FUTURE,STDLIB,FIRSTPARTY,THIRDPARTY,LOCALFOLDER,COBBLER,TESTS"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
exclude = ["build", "venv", ".venv", "orthos2/data/migrations"]

[tool.markdownlint-cli2]
globs = ["**.md"]
ignores = ["node_modules", ".venv"]
