[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "orthos2.settings"
# Keep the Django test run scoped to the app; docker/cobbler-http-sd/tests is a standalone,
# non-Django test suite with its own dedicated runner (see docker/cobbler-http-sd/README).
testpaths = ["orthos2"]

[tool.isort]
profile = "black"
known_cobbler="orthos2"
known_tests="tests"
sections="FUTURE,STDLIB,FIRSTPARTY,THIRDPARTY,LOCALFOLDER,COBBLER,TESTS"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
exclude = ["build", "venv", ".venv", "orthos2/data/migrations"]

[tool.markdownlint-cli2]
globs = ["**.md"]
ignores = ["node_modules", ".venv"]
